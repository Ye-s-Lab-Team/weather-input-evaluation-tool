[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashrae1939-weather-eval"
version = "0.1.0"
description = "Initial implementation framework for ASHRAE 1939-TRP"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
